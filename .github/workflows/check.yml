name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: git fetch origin main:main || true
      - run: make check-contracts
      - run: make check-ownership
      - run: python scripts/scan_secrets.py
      - name: module tests (per branch owner)
        run: |
          B="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$B" in
            p1a/*) make test-p1a ;;
            p1b/*) make test-p1b ;;
            p2/*)  make test-p2 ;;
            *)     make test ;;
          esac
