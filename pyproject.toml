[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofkit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.9.2",
  "anthropic==0.39.0",
  "python-dotenv==1.0.1",
  "pypdf==5.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.7.1",
  "bandit==1.7.10",
  "pip-audit==2.7.3",
  "pre-commit==4.0.1",
]
ui = ["streamlit==1.39.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -m 'not live' --strict-markers"
markers = [
  "live: calls the real LLM/network (opt-in: pytest -m live)",
  "slow: slow test",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S"]
ignore = ["S101", "E501"]   # asserts fine; long lines fine for a hackathon

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "F401"]
"scripts/**" = ["S603", "S607"]

[tool.coverage.run]
source = ["src/proofkit"]
